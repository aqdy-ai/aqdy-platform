# Doppler project configuration
# Generated by `doppler setup` — you can run that command or create this manually.
# This file tells the Doppler CLI which project + environment to use in each directory.

setup:
  # Backend project
  - directory: backend
    project: backend
    environment: dev

  # Root-level scripts (e.g. docker-compose)
  - directory: .
    project: backend
    environment: dev
