services:
  mongo:
    image: mongo:6.0
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/aqdy_platform
    command: sh -c "npm install && npm run dev"
    depends_on:
      mongo:
        condition: service_healthy

  # NOTE: Frontend is NOT run in Docker because Vite/esbuild uses mmap() syscalls
  # that are incompatible with old Linux kernels (< 4.x). Run it on your host instead:
  #   cd frontend && npm install && npm run dev

volumes:
  mongo-data:
  backend_node_modules:

