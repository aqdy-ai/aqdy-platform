services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env  # Point to the root .env file

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # This bakes the Google Client ID into the Vite static build
        - VITE_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
        - VITE_API_URL=http://localhost:3000/api
    ports:
      - "8080:80"